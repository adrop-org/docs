<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="100%" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15">
  <defs><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <g fill="#FAFAF7" stroke="#111111" stroke-width="2">
